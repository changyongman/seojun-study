<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3fbf7"><title>서준이 영어 공부방</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;color:#26374e;background:radial-gradient(circle at 10% 0,#dff7e8 0,transparent 32%),radial-gradient(circle at 100% 8%,#e0efff 0,transparent 32%),linear-gradient(155deg,#f8fffb,#fffaf1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button{font:inherit;touch-action:manipulation;cursor:pointer}button:active{transform:scale(.97)}.app{width:min(100%,620px);min-height:100vh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}header{text-align:center}.title{margin:0;color:#245b4a;font-size:clamp(28px,8vw,39px);letter-spacing:-1.2px}.subtitle{margin:7px 0 17px;color:#72827c;font-size:14px;font-weight:700}.progress{height:10px;overflow:hidden;background:#e3ebe7;border-radius:999px}.progress-bar{height:100%;border-radius:inherit;background:linear-gradient(90deg,#48b88b,#65a6e8);transition:width .25s}.status{display:flex;justify-content:space-between;margin:8px 3px 16px;color:#76847f;font-size:13px;font-weight:800}.card{min-height:470px;padding:30px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;background:#fffffff2;border:2px solid #fff;border-radius:30px;box-shadow:0 15px 38px #3658461a}.label{color:#8b9994;font-size:13px;font-weight:900;letter-spacing:1px}.word{width:100%;margin:22px 0 13px;padding:10px 5px;color:#234a75;background:transparent;border:0;font-size:clamp(42px,13vw,68px);font-weight:950;overflow-wrap:anywhere}.speak-tip{margin:-5px 0 21px;color:#87938f;font-size:13px;font-weight:700}.actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{min-height:53px;border:0;border-radius:16px;font-size:16px;font-weight:900}.hint-button{color:#196f5b;background:#ddf7ed}.meaning-button{color:#a45b16;background:#fff0d3}.reveal{width:100%;min-height:150px;margin-top:18px;display:grid;place-items:center;background:#f7faf8;border:2px dashed #dfe9e4;border-radius:22px}.placeholder{color:#a1aaa7;font-size:14px;font-weight:700}.hint-image{display:none;font-size:86px;line-height:1.15;animation:pop .25s ease}.hint-image.show{display:block}.meaning{display:none;padding:12px;color:#e3674f;font-size:clamp(23px,7vw,31px);font-weight:950;line-height:1.35;animation:pop .25s ease}.meaning.show{display:block}@keyframes pop{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}.nav{position:sticky;bottom:10px;margin-top:17px;padding:9px;display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#ffffffea;border:1px solid #e3ebe7;border-radius:21px;box-shadow:0 10px 30px #314d4027;backdrop-filter:blur(12px)}.nav-button{min-height:53px;color:#fff;background:#6076aa;border:0;border-radius:15px;font-size:17px;font-weight:900}.nav-button.next{background:linear-gradient(135deg,#44b98d,#3e98d1)}.nav-button:disabled{opacity:.3}.shuffle{display:block;margin:13px auto 0;padding:8px 13px;color:#7d8985;background:transparent;border:1px solid #d4dfda;border-radius:11px;font-size:13px;font-weight:800}@media(max-width:380px){.card{min-height:430px;padding-left:14px;padding-right:14px}.action{font-size:14px}.word{font-size:40px}}
</style></head><body><main class="app"><header><h1 class="title">서준이 영어 공부방</h1><p class="subtitle">단어를 누르면 발음을 들을 수 있어요</p></header><div class="progress"><div id="progressBar" class="progress-bar"></div></div><div class="status"><span id="position"></span><span>총 38단어</span></div><section class="card"><div class="label">TODAY'S WORD</div><button id="word" class="word" onclick="speakCurrent()"></button><div class="speak-tip">🔊 단어를 눌러 발음을 확인하세요</div><div class="actions"><button id="hintButton" class="action hint-button" onclick="toggleHint()">🖼️ 그림 힌트</button><button id="meaningButton" class="action meaning-button" onclick="toggleMeaning()">💡 뜻 보기</button></div><div class="reveal"><div id="placeholder" class="placeholder">힌트나 뜻을 눌러 보세요</div><div id="hintImage" class="hint-image" aria-label="그림 힌트"></div><div id="meaning" class="meaning"></div></div></section><nav class="nav"><button id="previous" class="nav-button" onclick="move(-1)">← 이전</button><button id="next" class="nav-button next" onclick="move(1)">다음 →</button></nav><button class="shuffle" onclick="shuffleWords()">🔀 순서 섞기</button></main>
<script>
const originalWords=[
{word:"hole",meaning:"구멍",image:"🕳️"},{word:"cash",meaning:"현금",image:"💵"},{word:"palace",meaning:"궁전",image:"🏰"},{word:"wedding",meaning:"결혼, 결혼식",image:"💒"},{word:"march",meaning:"행진",image:"🥁"},{word:"cheer",meaning:"응원, 격려",image:"📣"},{word:"straight",meaning:"똑바른, 쭉 뻗은",image:"📏"},{word:"guide",meaning:"안내자, 안내하다",image:"🧭"},{word:"slide",meaning:"미끄러지다, 미끄럼틀, 미끄러짐",image:"🛝"},{word:"receive",meaning:"받다",image:"📥"},{word:"lock",meaning:"자물쇠, 잠그다",image:"🔒"},{word:"lead",meaning:"이끌다",image:"🚶‍♂️➡️"},{word:"fry",meaning:"튀김, 튀기다",image:"🍳"},{word:"sail",meaning:"항해하다",image:"⛵"},{word:"bakery",meaning:"빵집, 제과점",image:"🥐"},{word:"adventure",meaning:"모험",image:"🗺️"},{word:"wide",meaning:"넓은",image:"↔️"},{word:"burn",meaning:"타다, 불태우다",image:"🔥"},{word:"alarm",meaning:"놀람, 경보, 놀라게 하다",image:"⏰"},{word:"wave",meaning:"파도, 물결",image:"🌊"},{word:"wheel",meaning:"수레바퀴, 자동차의 핸들",image:"🛞"},{word:"assist",meaning:"돕다",image:"🤝"},{word:"shake",meaning:"흔들다, 흔들리다",image:"🫨"},{word:"quick",meaning:"빠른",image:"🏍️💨"},{word:"cow",meaning:"암소, 젖소",image:"🐄"},{word:"glass",meaning:"유리",image:"🪟"},{word:"pocket",meaning:"호주머니",image:"👖"},{word:"monster",meaning:"괴물",image:"👾"},{word:"rice",meaning:"쌀, 밥",image:"🍚"},{word:"god",meaning:"신, 하느님",image:"🙏"},{word:"hill",meaning:"언덕",image:"🌄"},{word:"shuttle",meaning:"왕복의, 왕복 운행",image:"🚌↔️"},{word:"meat",meaning:"고기",image:"🥩"},{word:"lesson",meaning:"수업",image:"🧑‍🏫"},{word:"cart",meaning:"손수레",image:"🛒"},{word:"safe",meaning:"안전한",image:"🛡️"},{word:"ready",meaning:"준비가 된",image:"✅"},{word:"action",meaning:"행동, 연기",image:"🎬"}];
let words=[...originalWords],index=0,hintOpen=false,meaningOpen=false,voices=[];
function loadVoices(){voices=speechSynthesis.getVoices()}function englishVoice(){loadVoices();const us=voices.filter(v=>v.lang.toLowerCase().replace("_","-").startsWith("en-us"));return us.find(v=>/samantha|ava|allison|susan|zira/i.test(v.name))||us[0]||voices.find(v=>v.lang.toLowerCase().startsWith("en"))}
function speakCurrent(){if(!("speechSynthesis" in window)){alert("이 기기에서는 음성 기능을 사용할 수 없어요.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(words[index].word),voice=englishVoice();if(voice){u.voice=voice;u.lang=voice.lang}else u.lang="en-US";u.rate=.88;u.pitch=1;u.volume=1;speechSynthesis.speak(u)}
function toggleHint(){hintOpen=!hintOpen;if(hintOpen)meaningOpen=false;updateReveal()}function toggleMeaning(){meaningOpen=!meaningOpen;if(meaningOpen)hintOpen=false;updateReveal()}
function updateReveal(){const hint=document.getElementById("hintImage"),meaning=document.getElementById("meaning"),placeholder=document.getElementById("placeholder");hint.classList.toggle("show",hintOpen);meaning.classList.toggle("show",meaningOpen);placeholder.style.display=hintOpen||meaningOpen?"none":"block";document.getElementById("hintButton").textContent=hintOpen?"그림 숨기기":"🖼️ 그림 힌트";document.getElementById("meaningButton").textContent=meaningOpen?"뜻 숨기기":"💡 뜻 보기"}
function render(){const item=words[index];hintOpen=false;meaningOpen=false;document.getElementById("word").textContent=item.word;document.getElementById("hintImage").textContent=item.image;document.getElementById("meaning").textContent=item.meaning;document.getElementById("position").textContent=`${index+1} / ${words.length}`;document.getElementById("progressBar").style.width=`${((index+1)/words.length)*100}%`;document.getElementById("previous").disabled=index===0;document.getElementById("next").textContent=index===words.length-1?"처음으로 ↻":"다음 →";updateReveal();window.scrollTo({top:0,behavior:"smooth"})}
function move(direction){if(direction<0&&index>0)index--;else if(direction>0)index=index<words.length-1?index+1:0;render()}function shuffleWords(){for(let i=words.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[words[i],words[j]]=[words[j],words[i]]}index=0;render()}
loadVoices();if("onvoiceschanged" in speechSynthesis)speechSynthesis.onvoiceschanged=loadVoices;render();
</script></body></html>
