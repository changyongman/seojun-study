<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f5f7ff">
  <title>서준이 영어 공부방</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: #25324a;
      background: linear-gradient(160deg, #f7f9ff, #fff9ee);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 620px);
      min-height: 100vh;
      margin: 0 auto;
      padding:
        calc(24px + env(safe-area-inset-top))
        16px
        calc(25px + env(safe-area-inset-bottom));
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #263b69;
      font-size: clamp(28px, 8vw, 38px);
      letter-spacing: -1px;
    }

    .description {
      margin: 8px 0 17px;
      color: #728099;
      font-size: 15px;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      background: #e7eaf2;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #667eea, #ff8c70);
      transition: width 0.25s ease;
    }

    .progress-text {
      margin-top: 8px;
      color: #728099;
      font-size: 14px;
      font-weight: 700;
    }

    .cards {
      display: grid;
      gap: 11px;
    }

    .card {
      padding: 15px 16px;
      background: #fff;
      border: 1px solid #e8ebf3;
      border-radius: 19px;
      box-shadow: 0 7px 20px rgba(56, 70, 105, 0.08);
    }

    .word-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .number {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #6675a5;
      background: #eef1ff;
      border-radius: 50%;
      font-size: 13px;
      font-weight: 900;
    }

    .word-button {
      min-width: 0;
      flex: 1;
      padding: 5px 0;
      overflow-wrap: anywhere;
      text-align: left;
      color: #253967;
      background: transparent;
      border: 0;
      font-size: clamp(25px, 7vw, 34px);
      font-weight: 900;
      cursor: pointer;
    }

    .speak-button {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      padding: 0;
      color: #167568;
      background: #e1f7f1;
      border: 0;
      border-radius: 14px;
      font-size: 21px;
      cursor: pointer;
    }

    .meaning-area {
      margin: 9px 0 0 42px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meaning-button {
      min-height: 36px;
      padding: 7px 13px;
      color: #a45b16;
      background: #fff1d5;
      border: 0;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .meaning {
      color: #ed7057;
      font-size: 18px;
      font-weight: 900;
      opacity: 0;
      transform: translateX(-5px);
      transition: 0.2s ease;
    }

    .meaning.visible {
      opacity: 1;
      transform: translateX(0);
    }

    button:active {
      transform: scale(0.96);
    }

    nav {
      position: sticky;
      bottom: 10px;
      margin-top: 18px;
      padding: 9px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #e8ebf3;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(49, 61, 91, 0.16);
      backdrop-filter: blur(12px);
    }

    .nav-button {
      min-height: 52px;
      color: #fff;
      background: #6373b8;
      border: 0;
      border-radius: 15px;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }

    .nav-button.next {
      background: linear-gradient(135deg, #ff9d4d, #ff746a);
    }

    .nav-button:disabled {
      opacity: 0.32;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <h1>서준이 영어 공부방</h1>
      <p class="description">
        영어 단어를 누르면 발음을 들을 수 있어요
      </p>

      <div class="progress-track">
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <div id="progressText" class="progress-text"></div>
    </header>

    <section id="cards" class="cards"></section>

    <nav>
      <button
        id="previousButton"
        class="nav-button"
        onclick="previousPage()"
      >
        ← 이전
      </button>

      <button
        id="nextButton"
        class="nav-button next"
        onclick="nextPage()"
      >
        다음 →
      </button>
    </nav>
  </main>

  <script>
    /*
      보내주신 표를 세로 방향으로 정렬했습니다.

      첫 번째 세로줄
      → 두 번째 세로줄
      → 세 번째 세로줄
    */

    const words = [
      // 첫 번째 세로줄
      ["hasty", "성급한"],
      ["gym", "체육관"],
      ["pillow", "베개"],
      ["village", "마을"],
      ["trip", "여행"],
      ["fireman", "소방관"],
      ["culture", "문화"],
      ["trousers", "바지"],
      ["pair", "한 쌍"],
      ["pumpkin", "호박"],
      ["prize", "상"],
      ["enemy", "적"],
      ["museum", "박물관"],
      ["elbow", "팔꿈치"],
      ["honor", "명예"],
      ["amazing", "놀라운"],
      ["giant", "거인"],
      ["vegetable", "채소"],
      ["board", "판자, 게시판"],
      ["blackboard", "칠판"],
      ["own", "자신의, 소유하다"],
      ["loser", "패자"],
      ["discuss", "의논하다"],
      ["finish", "끝내다"],

      // 두 번째 세로줄
      ["muscle", "근육"],
      ["moment", "순간"],
      ["honesty", "정직"],
      ["South", "남쪽"],
      ["Southern", "남쪽의"],
      ["North", "북쪽"],
      ["northern", "북쪽의"],
      ["borrow", "빌리다"],
      ["departure", "출발"],
      ["history", "역사"],
      ["mill", "방앗간"],
      ["windmill", "풍차"],
      ["both", "둘 다"],
      ["senior", "선배, 연장자"],
      ["donkey", "당나귀"],
      ["laundry", "세탁물"],
      ["woodpecker", "딱따구리"],
      ["throat", "목구멍"],
      ["cancel", "취소하다"],
      ["underground", "지하의"],
      ["than", "~보다"],
      ["mate", "친구, 짝"],
      ["classmate", "반 친구"],
      ["roommate", "방을 함께 쓰는 사람"],

      // 세 번째 세로줄
      ["twinkle", "반짝이다"],
      ["draw", "그리다"],
      ["teen", "십 대"],
      ["iron", "철, 다리미"],
      ["behind", "뒤에"],
      ["until", "~까지"],
      ["care", "돌보다, 관심"],
      ["each", "각각의"],
      ["dawn", "새벽"],
      ["climb", "오르다"],
      ["sad", "슬픈"],
      ["catch", "잡다"],
      ["merry", "즐거운"],
      ["sand", "모래"],
      ["crab", "게"],
      ["filter", "거르다, 필터"],
      ["heat", "열"],
      ["shut", "닫다"],
      ["castle", "성"],
      ["knock", "두드리다"],
      ["self", "자기 자신"],
      ["flash", "번쩍이다"],
      ["weight", "무게"],
      ["enter", "들어가다"]
    ];

    const wordsPerPage = 6;
    const pageCount = Math.ceil(words.length / wordsPerPage);

    let currentPage = 0;

    function speak(word) {
      if (!("speechSynthesis" in window)) {
        alert("이 기기에서는 음성 기능을 사용할 수 없어요.");
        return;
      }

      speechSynthesis.cancel();

      const speech = new SpeechSynthesisUtterance(word);

      speech.lang = "en-US";
      speech.rate = 0.78;
      speech.pitch = 1.02;

      const voices = speechSynthesis.getVoices();

      const englishVoice = voices.find((voice) =>
        voice.lang.toLowerCase().startsWith("en-us")
      );

      if (englishVoice) {
        speech.voice = englishVoice;
      }

      speechSynthesis.speak(speech);
    }

    function showMeaning(index) {
      const meaning = document.getElementById(
        `meaning-${index}`
      );

      const button = document.getElementById(
        `meaningButton-${index}`
      );

      const isVisible = meaning.classList.toggle("visible");

      button.textContent = isVisible
        ? "숨기기"
        : "뜻 보기";
    }

    function renderWords() {
      const start = currentPage * wordsPerPage;

      const pageWords = words.slice(
        start,
        start + wordsPerPage
      );

      const cards = document.getElementById("cards");

      cards.innerHTML = pageWords
        .map(([word, meaning], pageIndex) => {
          const index = start + pageIndex;

          return `
            <article class="card">
              <div class="word-row">
                <div class="number">
                  ${index + 1}
                </div>

                <button
                  class="word-button"
                  onclick='speak(${JSON.stringify(word)})'
                >
                  ${word}
                </button>

                <button
                  class="speak-button"
                  onclick='speak(${JSON.stringify(word)})'
                  aria-label="${word} 발음 듣기"
                >
                  🔊
                </button>
              </div>

              <div class="meaning-area">
                <button
                  id="meaningButton-${index}"
                  class="meaning-button"
                  onclick="showMeaning(${index})"
                >
                  뜻 보기
                </button>

                <span
                  id="meaning-${index}"
                  class="meaning"
                >
                  ${meaning}
                </span>
              </div>
            </article>
          `;
        })
        .join("");

      document.getElementById("progressText").textContent =
        `${currentPage + 1} / ${pageCount} 페이지 · 총 ${words.length}단어`;

      document.getElementById("progressBar").style.width =
        `${((currentPage + 1) / pageCount) * 100}%`;

      document.getElementById("previousButton").disabled =
        currentPage === 0;

      document.getElementById("nextButton").textContent =
        currentPage === pageCount - 1
          ? "처음으로 ↻"
          : "다음 →";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function previousPage() {
      if (currentPage > 0) {
        currentPage--;
        renderWords();
      }
    }

    function nextPage() {
      if (currentPage < pageCount - 1) {
        currentPage++;
      } else {
        currentPage = 0;
      }

      renderWords();
    }

    speechSynthesis.getVoices();
    renderWords();
  </script>
</body>
</html>
